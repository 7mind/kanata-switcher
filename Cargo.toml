[package]
name = "kanata-switcher"
version = "1.1.1"
edition = "2024"
license = "MIT"
description = "Daemon for kanata layer switching based on focused window"

[[bin]]
name = "kanata-switcher"
path = "src/daemon/main.rs"

[features]
default = ["embed-gnome-extension"]
embed-gnome-extension = []

[dependencies]
tokio = { version = "=1.49.0", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
regex = "=1.12.2"
clap = { version = "=4.5.54", features = ["derive"] }
dirs = "=5.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.13.2"
tempfile = "=3.24.0"
libc = "=0.2.180"
futures-util = "=0.3.31"
wayland-client = "=0.31.12"
wayland-protocols-wlr = { version = "=0.3.10", features = ["client"] }
wayland-backend = "=0.3.12"
wayland-scanner = "=0.31.8"
x11rb = "=0.13.2"
ksni = "=0.2.2"
noto-sans-mono-bitmap = { version = "=0.3.2", default-features = false, features = ["regular", "size_32", "unicode-basic-latin"] }
uuid = { version = "=1.20.0", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.5.1"
core-foundation-sys = "=0.8.7"
objc2 = "=0.5.2"
objc2-app-kit = { version = "=0.2.2", features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSNotification", "NSOperation", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
] }

[dev-dependencies]
proptest = "=1.9.0"
tokio-test = "=0.4.5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "=0.31.11"
wayland-protocols-wlr = { version = "=0.3.10", features = ["server"] }
